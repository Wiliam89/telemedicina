# =============================================================================
#  Integracao continua (ADR-0020): todo push e pull request passa por aqui.
#
#    1. tipos nos 4 pacotes
#    2. testes de unidade (os de banco sao pulados)
#    3. compilacao de producao da API e do site
#    4. testes contra um Postgres descartavel, que nasce e morre com o job.
#       Nao precisa de segredo e nunca toca em dado real.
#    5. dependencias com falha critica conhecida barram a entrega
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Falhas criticas nas dependencias
        run: pnpm audit --prod --audit-level=critical
      - name: Testes de unidade
        run: pnpm test
      - name: Compilar a API
        run: pnpm --filter @tele/api build
      - name: Compilar o site
        run: pnpm --filter web build
        env:
          # Valores de mentira so para compilar - o site real usa os da Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_compilacao_de_teste
          NEXT_PUBLIC_API_URL: http://localhost:3333
          NEXT_PUBLIC_AMBIENTE: desenvolvimento

  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verificar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: tele_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:teste@localhost:5432/tele_teste
      DATABASE_URL_TESTE: postgresql://postgres:teste@localhost:5432/tele_teste
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar o banco
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/preparar-banco-de-teste.sql
      - name: Migracoes
        run: pnpm --filter @tele/db migrar
      - name: Testes contra o Postgres
        run: pnpm test:banco
