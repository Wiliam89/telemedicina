# Diz ao pnpm: "tudo dentro de apps/ e packages/ faz parte deste mesmo projeto".
packages:
  - "apps/*"
  - "packages/*"

# Pacotes que podem rodar scripts de instalacao (o pnpm bloqueia por padrao).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@tailwindcss/oxide"

# Correcoes de seguranca em dependencias indiretas (pnpm audit).
overrides:
  "postcss@<8.5.23": "^8.5.23"
  "fast-uri@^3": "^3.1.9"
  "fast-uri@^4": "^4.2.3"
  "source-map-js@<1.2.2": "^1.2.2"
